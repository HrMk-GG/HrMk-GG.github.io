<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHOTO FIT — テンプレート合成</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+JP:wght@500;700;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121214; --panel:#1b1b1f; --panel-2:#232328; --line:#313136;
    --ink:#f4f2ec; --ink-dim:#9a9aa2; --accent:#6a3dff; --accent-2:#39c93f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    padding:28px 20px 60px;
  }
  .wrap{ max-width:1100px; margin:0 auto; }
  header{
    display:flex; align-items:baseline; justify-content:space-between;
    flex-wrap:wrap; gap:10px; margin-bottom:24px;
    border-bottom:3px solid var(--ink); padding-bottom:16px;
  }
  .logo{
    font-family:'Anton', sans-serif; font-size:clamp(26px,4.5vw,40px);
    display:flex; align-items:center; gap:12px; letter-spacing:.5px;
  }
  .logo .sq{ width:15px; height:15px; background:var(--accent); display:inline-block; }
  .logo .sq2{ width:15px; height:15px; background:var(--accent-2); display:inline-block; margin-left:-6px; }
  .tagline{ color:var(--ink-dim); font-size:13px; max-width:280px; text-align:right; line-height:1.5; }

  .layout{ display:grid; grid-template-columns: 1fr 300px; gap:22px; align-items:start; }
  @media (max-width:840px){ .layout{grid-template-columns:1fr;} .tagline{text-align:left;max-width:none;} }

  .stage{ background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:18px; }
  #canvasWrap{ line-height:0; border-radius:2px; overflow:hidden; background:#000; }
  #outCanvas{ display:block; width:100%; height:auto; }

  .stage-actions{ display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
  button{
    font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:14px;
    border-radius:4px; border:1px solid var(--line); background:var(--panel-2);
    color:var(--ink); padding:10px 16px; cursor:pointer;
    transition:transform .08s ease, border-color .12s ease, background .12s ease;
  }
  button:hover{ border-color:#5a5a63; }
  button:active{ transform:translateY(1px); }
  button.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary:hover{ background:#7c53ff; }
  button.small{ padding:6px 10px; font-size:12px; }
  input[type=file]{ display:none; }

  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:6px;
    padding:18px; display:flex; flex-direction:column; gap:22px;
  }
  .slot-block h2{
    font-family:'Anton', sans-serif; font-weight:400; font-size:14px;
    letter-spacing:.5px; margin:0 0 4px 0; display:flex; align-items:center; gap:8px;
  }
  .slot-block h2 .chip{ width:12px; height:12px; border-radius:3px; display:inline-block; }
  .slot-block .sub{ font-size:12px; color:var(--ink-dim); margin-bottom:10px; }
  .slot-thumb{
    width:100%; aspect-ratio:1/1; border-radius:4px; border:1px dashed #45454c;
    background:repeating-conic-gradient(#26262c 0% 25%, #201f24 0% 50%) 0 0 / 20px 20px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    overflow:hidden; position:relative; margin-bottom:10px;
  }
  .slot-thumb .msg{ color:var(--ink-dim); font-size:12px; text-align:center; padding:10px; }
  .slot-thumb canvas{ width:100%; height:100%; display:block; touch-action:none; }
  .field{ display:flex; flex-direction:column; gap:6px; margin-bottom:8px; }
  .field label{ font-size:11px; color:var(--ink-dim); display:flex; justify-content:space-between; }
  input[type=range]{ width:100%; accent-color:var(--accent); }
  .slot-actions{ display:flex; gap:8px; }
  hr.sep{ border:none; border-top:1px solid var(--line); margin:0; }
  .hint{ font-size:12px; color:var(--ink-dim); line-height:1.6; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><span class="sq"></span><span class="sq2"></span>PHOTO FIT</div>
    <div class="tagline">テンプレートの青と緑のマスに、自分の写真を合わせ込んでダウンロード。</div>
  </header>

  <div class="layout">
    <div class="stage">
      <div id="canvasWrap">
        <canvas id="outCanvas"></canvas>
      </div>
      <div class="stage-actions">
        <button id="downloadBtn" class="primary">ダウンロード</button>
      </div>
    </div>

    <div class="panel">
      <div class="slot-block" data-slot="blue">
        <h2><span class="chip" style="background:#6a3dff;"></span>青いマス</h2>
        <div class="sub">クリックして画像を選択。写真の上をドラッグで位置調整。</div>
        <div class="slot-thumb" id="thumb-blue">
          <div class="msg">クリックして画像を選択</div>
        </div>
        <div class="field">
          <label>ズーム <span class="zoom-val">100%</span></label>
          <input type="range" class="zoom-range" min="100" max="300" value="100" step="1">
        </div>
        <div class="slot-actions">
          <button class="small change-btn">画像を変更</button>
          <button class="small reset-btn">位置をリセット</button>
        </div>
        <input type="file" class="file-input" accept="image/*">
      </div>

      <hr class="sep">

      <div class="slot-block" data-slot="green">
        <h2><span class="chip" style="background:#39c93f;"></span>緑のマス</h2>
        <div class="sub">クリックして画像を選択。写真の上をドラッグで位置調整。</div>
        <div class="slot-thumb" id="thumb-green">
          <div class="msg">クリックして画像を選択</div>
        </div>
        <div class="field">
          <label>ズーム <span class="zoom-val">100%</span></label>
          <input type="range" class="zoom-range" min="100" max="300" value="100" step="1">
        </div>
        <div class="slot-actions">
          <button class="small change-btn">画像を変更</button>
          <button class="small reset-btn">位置をリセット</button>
        </div>
        <input type="file" class="file-input" accept="image/*">
      </div>

      <div class="hint">サムネイル内の写真をドラッグすると、マスの中の見える範囲を動かせます。</div>
    </div>
  </div>
</div>

  const TEMPLATE_W = 1280, TEMPLATE_H = 1280;

  // Slot rectangles measured from the template (in template pixel coords)
  const SLOTS = {
    blue:  { x: 0,   y: 0,   w: 639, h: 639 },
    green: { x: 0,   y: 640, w: 639, h: 640 },
  };

  const outCanvas = document.getElementById('outCanvas');
  const outCtx = outCanvas.getContext('2d');
  outCanvas.width = TEMPLATE_W;
  outCanvas.height = TEMPLATE_H;

  const templateImg = new Image();
  templateImg.onload = () => renderOutput();
  templateImg.src = "data:image/jpeg;base64," + TEMPLATE_B64;

  // state per slot: { img, natW, natH, offsetX, offsetY (in slot-px, top-left of visible crop), zoom }
  const state = {
    blue: null,
    green: null,
  };

  function coverBaseScale(slot, natW, natH){
    return Math.max(slot.w / natW, slot.h / natH);
  }

  function clampOffset(slotKey){
    const s = state[slotKey];
    const slot = SLOTS[slotKey];
    const scale = coverBaseScale(slot, s.natW, s.natH) * (s.zoom / 100);
    const drawW = s.natW * scale;
    const drawH = s.natH * scale;
    const minX = slot.w - drawW; // offsetX ranges [minX, 0]
    const minY = slot.h - drawH;
    s.offsetX = Math.min(0, Math.max(minX, s.offsetX));
    s.offsetY = Math.min(0, Math.max(minY, s.offsetY));
  }

  function drawSlotInto(ctx, slotKey, targetX, targetY, targetW, targetH, scaleFactor){
    // scaleFactor maps slot-px -> target canvas px (1 for thumb sized to slot px, or output/slot ratio)
    const s = state[slotKey];
    const slot = SLOTS[slotKey];
    if(!s || !s.img) return;
    const scale = coverBaseScale(slot, s.natW, s.natH) * (s.zoom / 100);
    ctx.save();
    ctx.beginPath();
    ctx.rect(targetX, targetY, targetW, targetH);
    ctx.clip();
    const dx = targetX + s.offsetX * scaleFactor;
    const dy = targetY + s.offsetY * scaleFactor;
    const dw = s.natW * scale * scaleFactor;
    const dh = s.natH * scale * scaleFactor;
    ctx.drawImage(s.img, dx, dy, dw, dh);
    ctx.restore();
  }

  function renderOutput(){
    outCtx.clearRect(0,0,TEMPLATE_W,TEMPLATE_H);
    outCtx.drawImage(templateImg, 0, 0, TEMPLATE_W, TEMPLATE_H);
    Object.keys(SLOTS).forEach(key => {
      const slot = SLOTS[key];
      drawSlotInto(outCtx, key, slot.x, slot.y, slot.w, slot.h, 1);
    });
    renderThumbs();
  }

  function renderThumbs(){
    Object.keys(SLOTS).forEach(key => {
      const s = state[key];
      const holder = document.getElementById('thumb-' + key);
      if(!s || !s.img) return;
      let cv = holder.querySelector('canvas');
      if(!cv){
        holder.innerHTML = '';
        cv = document.createElement('canvas');
        holder.appendChild(cv);
        attachDrag(cv, key);
      }
      const slot = SLOTS[key];
      const size = 300; // internal thumb resolution
      cv.width = size; cv.height = size * (slot.h / slot.w);
      const tctx = cv.getContext('2d');
      tctx.clearRect(0,0,cv.width,cv.height);
      const scaleFactor = size / slot.w;
      drawSlotInto(tctx, key, 0, 0, slot.w * scaleFactor, slot.h * scaleFactor, scaleFactor);
    });
  }

  function attachDrag(cv, slotKey){
    let dragging = false;
    let lastX = 0, lastY = 0;
    const slot = SLOTS[slotKey];

    function pointFromEvent(e){
      const rect = cv.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top, rectW: rect.width, rectH: rect.height };
    }

    cv.addEventListener('pointerdown', (e) => {
      dragging = true;
      const p = pointFromEvent(e);
      lastX = p.x; lastY = p.y;
      cv.setPointerCapture(e.pointerId);
    });
    cv.addEventListener('pointermove', (e) => {
      if(!dragging) return;
      const p = pointFromEvent(e);
      const dxPx = p.x - lastX;
      const dyPx = p.y - lastY;
      lastX = p.x; lastY = p.y;
      // convert thumb px -> slot px
      const scaleFactor = p.rectW / slot.w;
      const s = state[slotKey];
      s.offsetX += dxPx / scaleFactor;
      s.offsetY += dyPx / scaleFactor;
      clampOffset(slotKey);
      renderOutput();
    });
    function endDrag(e){ dragging = false; }
    cv.addEventListener('pointerup', endDrag);
    cv.addEventListener('pointercancel', endDrag);
  }

  function loadFileForSlot(slotKey, file){
    if(!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const image = new Image();
      image.onload = () => {
        const slot = SLOTS[slotKey];
        const scale = coverBaseScale(slot, image.naturalWidth, image.naturalHeight);
        const drawW = image.naturalWidth * scale;
        const drawH = image.naturalHeight * scale;
        state[slotKey] = {
          img: image,
          natW: image.naturalWidth,
          natH: image.naturalHeight,
          zoom: 100,
          offsetX: (slot.w - drawW) / 2,
          offsetY: (slot.h - drawH) / 2,
        };
        renderOutput();
      };
      image.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  document.querySelectorAll('.slot-block').forEach(block => {
    const key = block.dataset.slot;
    const thumb = document.getElementById('thumb-' + key);
    const fileInput = block.querySelector('.file-input');
    const zoomRange = block.querySelector('.zoom-range');
    const zoomVal = block.querySelector('.zoom-val');
    const changeBtn = block.querySelector('.change-btn');
    const resetBtn = block.querySelector('.reset-btn');

    thumb.addEventListener('click', () => { if(!state[key]) fileInput.click(); });
    changeBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      if(e.target.files && e.target.files[0]) loadFileForSlot(key, e.target.files[0]);
    });
    zoomRange.addEventListener('input', () => {
      if(!state[key]) return;
      state[key].zoom = parseInt(zoomRange.value, 10);
      zoomVal.textContent = zoomRange.value + '%';
      clampOffset(key);
      renderOutput();
    });
    resetBtn.addEventListener('click', () => {
      if(!state[key]) return;
      const slot = SLOTS[key];
      const s = state[key];
      s.zoom = 100;
      zoomRange.value = 100;
      zoomVal.textContent = '100%';
      const scale = coverBaseScale(slot, s.natW, s.natH);
      const drawW = s.natW * scale;
      const drawH = s.natH * scale;
      s.offsetX = (slot.w - drawW) / 2;
      s.offsetY = (slot.h - drawH) / 2;
      renderOutput();
    });
  });

  document.getElementById('downloadBtn').addEventListener('click', () => {
    renderOutput();
    const link = document.createElement('a');
    link.download = 'photo-fit.png';
    link.href = outCanvas.toDataURL('image/png');
    link.click();
  });
})();
