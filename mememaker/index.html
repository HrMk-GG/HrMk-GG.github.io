<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHOTO FIT</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121214; --panel:#1b1b1f; --panel-2:#232328; --line:#313136;
    --ink:#f4f2ec; --ink-dim:#9a9aa2; --accent:#6a3dff; --err:#ff5757;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; margin:0; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    display:flex; align-items:center; justify-content:center;
  }
  #gate{
    width:100%; max-width:340px; padding:32px 28px;
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    text-align:center;
  }
  #gate .lock{
    font-family:'Anton', sans-serif; font-size:26px; letter-spacing:.5px;
    margin-bottom:6px;
  }
  #gate .sub{ color:var(--ink-dim); font-size:13px; margin-bottom:22px; line-height:1.6; }
  #pwInput{
    width:100%; padding:12px 14px; font-size:15px;
    background:var(--panel-2); border:1px solid var(--line); border-radius:4px;
    color:var(--ink); margin-bottom:12px; text-align:center;
    letter-spacing:2px;
  }
  #pwInput:focus{ outline:none; border-color:var(--accent); }
  #unlockBtn{
    width:100%; padding:12px 14px; font-size:14px; font-weight:600;
    background:var(--accent); border:1px solid var(--accent); border-radius:4px;
    color:#fff; cursor:pointer;
  }
  #unlockBtn:hover{ background:#7c53ff; }
  #unlockBtn:disabled{ opacity:.5; cursor:not-allowed; }
  #errMsg{ color:var(--err); font-size:12px; margin-top:12px; min-height:16px; }

  #appFrame{
    display:none; width:100%; height:100vh; border:none;
  }
  #appFrame.show{ display:block; }
  #gate.hide{ display:none; }
</style>
</head>
<body>
  <div id="gate">
    <div class="lock">🔒 PHOTO FIT</div>
    <div class="sub">このページはパスワードで保護されています。<br>パスワードを入力してください。</div>
    <input type="password" id="pwInput" placeholder="password" autocomplete="off">
    <button id="unlockBtn">開く</button>
    <div id="errMsg"></div>
  </div>
  <iframe id="appFrame" title="Photo Fit Tool"></iframe>

  const ITERATIONS = 250000;

  function b64ToBytes(b64){
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  const pwInput = document.getElementById('pwInput');
  const unlockBtn = document.getElementById('unlockBtn');
  const errMsg = document.getElementById('errMsg');
  const gate = document.getElementById('gate');
  const appFrame = document.getElementById('appFrame');

  async function tryUnlock(){
    const password = pwInput.value;
    if(!password){ return; }
    unlockBtn.disabled = true;
    errMsg.textContent = '';
    try {
      const salt = b64ToBytes(SALT_B64);
      const iv = b64ToBytes(IV_B64);
      const cipherBytes = b64ToBytes(CIPHER_B64);
      const enc = new TextEncoder();

      const baseKey = await crypto.subtle.importKey(
        'raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveKey']
      );
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: salt, iterations: ITERATIONS, hash: 'SHA-256' },
        baseKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
      const plainBuf = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: iv }, key, cipherBytes
      );
      const html = new TextDecoder().decode(plainBuf);

      appFrame.srcdoc = html;
      appFrame.classList.add('show');
      gate.classList.add('hide');
    } catch(e){
      errMsg.textContent = 'パスワードが違います。';
      unlockBtn.disabled = false;
    }
  }

  unlockBtn.addEventListener('click', tryUnlock);
  pwInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') tryUnlock(); });
})();
</script>
</body>
</html>
