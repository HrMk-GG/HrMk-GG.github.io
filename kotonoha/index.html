<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ことのは ― 言葉の意味を調べる</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #ffffff;
    --surface: #fafafa;
    --line: #e6e6e4;
    --ink: #1a1a1a;
    --muted: #7a7a7d;
    --accent: #1f2b6c;
    --accent-soft: #eef0fa;
    --accent-soft-2: #e2e6f7;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Zen Kaku Gothic New", sans-serif;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  .page{
    max-width: 640px;
    margin: 0 auto;
    padding: 72px 24px 100px;
  }

  /* ---------- Masthead ---------- */
  .masthead{
    text-align: center;
    margin-bottom: 56px;
  }

  .mark{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent);
    font-family: "Zen Old Mincho", serif;
    font-size: 24px;
    margin-bottom: 20px;
  }

  h1{
    font-family: "Zen Old Mincho", serif;
    font-weight: 600;
    font-size: 34px;
    letter-spacing: 0.04em;
    margin: 0 0 10px;
    color: var(--ink);
  }

  .tagline{
    margin:0;
    color: var(--muted);
    font-size: 14.5px;
    letter-spacing: 0.02em;
  }

  /* ---------- Search ---------- */
  .lookup{
    display:flex;
    align-items:flex-end;
    gap: 16px;
    border-bottom: 2px solid var(--line);
    padding-bottom: 12px;
    transition: border-color .35s ease;
  }

  .lookup:focus-within{
    border-color: var(--accent);
  }

  #term{
    flex:1;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    font-family: "Zen Kaku Gothic New", sans-serif;
    font-size: 21px;
    color: var(--ink);
    padding: 6px 2px;
  }

  #term::placeholder{
    color: #b9b9bb;
  }

  .search-btn{
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width: 108px;
    height: 46px;
    padding: 0 26px;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-family: "Zen Kaku Gothic New", sans-serif;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.03em;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(31,43,108,0.22);
    transition: transform .25s ease, box-shadow .25s ease, opacity .25s ease;
  }

  .search-btn::before{
    content:'';
    position:absolute;
    inset:0;
    background: linear-gradient(120deg, rgba(255,255,255,0) 30%, rgba(255,255,255,.28) 50%, rgba(255,255,255,0) 70%);
    transform: translateX(-130%);
    transition: transform .65s ease;
  }

  .search-btn:hover::before{ transform: translateX(130%); }

  .search-btn:hover{
    transform: translateY(-2px);
    box-shadow: 0 10px 22px rgba(31,43,108,0.30);
  }

  .search-btn:active{
    transform: translateY(0) scale(.96);
  }

  .search-btn:disabled{
    cursor: default;
    opacity: .85;
    transform:none;
  }

  .btn-loader{
    display:none;
    align-items:center;
    gap: 5px;
  }

  .btn-loader i{
    width:5px;
    height:5px;
    border-radius:50%;
    background:#fff;
    display:inline-block;
    animation: dotPulse 1.1s infinite ease-in-out;
  }
  .btn-loader i:nth-child(2){ animation-delay: .15s; }
  .btn-loader i:nth-child(3){ animation-delay: .3s; }

  @keyframes dotPulse{
    0%, 80%, 100%{ transform: scale(0.6); opacity:.4; }
    40%{ transform: scale(1); opacity:1; }
  }

  .search-btn.loading .btn-label{ display:none; }
  .search-btn.loading .btn-loader{ display:inline-flex; }

  .hint{
    text-align:center;
    color: var(--muted);
    font-size: 12.5px;
    margin: 22px 0 0;
    letter-spacing: 0.02em;
  }

  /* ---------- Result ---------- */
  .result{
    margin-top: 52px;
  }

  .result.show{
    animation: rise .55s cubic-bezier(.22,1,.36,1);
  }

  @keyframes rise{
    from{ opacity:0; transform: translateY(16px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .entry-head{
    display:flex;
    align-items:baseline;
    flex-wrap:wrap;
    gap: 12px 16px;
    margin-bottom: 18px;
  }

  .entry-word{
    font-family: "Zen Old Mincho", serif;
    font-size: 32px;
    font-weight: 600;
    color: var(--ink);
    word-break: break-word;
  }

  .pos-tag{
    display:inline-block;
    font-size: 12.5px;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 999px;
    padding: 4px 12px;
    letter-spacing: 0.02em;
  }

  .entry-rule{
    border:none;
    border-top: 1px solid var(--line);
    margin: 18px 0;
  }

  .def-block{ margin-bottom: 26px; }

  .def-block h3{
    font-family: "Zen Kaku Gothic New", sans-serif;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--accent);
    margin: 0 0 10px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--accent-soft-2);
    display:inline-block;
  }

  .def-block p{
    font-size: 16.5px;
    line-height: 1.9;
    color: var(--ink);
    margin: 0 0 8px;
  }

  .def-block ol{
    margin: 0;
    padding-left: 22px;
  }

  .def-block ol li{
    font-size: 16.5px;
    line-height: 1.85;
    margin-bottom: 10px;
  }

  .extract-box{
    max-height: 340px;
    overflow: hidden;
    position: relative;
    transition: max-height .5s ease;
  }

  .extract-box.expanded{
    max-height: 4000px;
  }

  .extract-box::after{
    content:'';
    position:absolute;
    left:0; right:0; bottom:0;
    height: 56px;
    background: linear-gradient(to bottom, rgba(255,255,255,0), #fff);
    pointer-events:none;
    transition: opacity .3s ease;
  }

  .extract-box.expanded::after{ opacity:0; }

  .expand-btn{
    display:inline-block;
    margin-top: 14px;
    background:none;
    border:none;
    color: var(--accent);
    font-size: 13.5px;
    font-weight: 500;
    cursor:pointer;
    padding: 0;
    border-bottom: 1px solid var(--accent-soft-2);
  }

  .source-line{
    margin-top: 28px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    font-size: 13px;
    color: var(--muted);
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
  }

  .source-line a{
    color: var(--accent);
    text-decoration:none;
    border-bottom: 1px solid var(--accent-soft-2);
  }

  .source-line a:hover{
    border-bottom-color: var(--accent);
  }

  .state-msg{
    text-align:center;
    color: var(--muted);
    font-family: "Zen Old Mincho", serif;
    font-size: 17px;
    padding: 30px 0;
  }

  .state-msg small{
    display:block;
    margin-top: 10px;
    font-family: "Zen Kaku Gothic New", sans-serif;
    font-size: 13px;
  }

  .alt-links{
    display:flex;
    justify-content:center;
    gap: 18px;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  .alt-links a{
    font-size: 13px;
    color: var(--accent);
    text-decoration:none;
    border-bottom: 1px solid var(--accent-soft-2);
  }

  .alt-links a:hover{ border-bottom-color: var(--accent); }

  @media (max-width: 480px){
    .page{ padding: 52px 18px 80px; }
    h1{ font-size: 27px; }
    .entry-word{ font-size: 26px; }
    #term{ font-size: 18px; }
  }
</style>
</head>
<body>

<div class="page">

  <header class="masthead">
    <div class="mark">辞</div>
    <h1>ことのは</h1>
    <p class="tagline">言葉を入れると、意味が静かに返ってくる。</p>
  </header>

  <form class="lookup" id="lookupForm">
    <input type="text" id="term" placeholder="調べたい言葉を入力してください" autocomplete="off" autofocus />
    <button type="submit" class="search-btn" id="searchBtn">
      <span class="btn-label">調べる</span>
      <span class="btn-loader" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>
  </form>

  <p class="hint">Wiktionary（ウィクショナリー）日本語版・英語版から意味を取得します</p>

  <section class="result" id="result" hidden></section>

</div>

<script>
(function(){
  const form = document.getElementById('lookupForm');
  const input = document.getElementById('term');
  const btn = document.getElementById('searchBtn');
  const result = document.getElementById('result');

  const HEADING_WORDS = [
    '日本語','英語','ハワイ語','フランス語','ドイツ語','中国語','朝鮮語','韓国語','ラテン語','イタリア語','スペイン語','ロシア語',
    '名詞','動詞','形容詞','形容動詞','副詞','助詞','助動詞','接続詞','感動詞','連体詞','接頭辞','接尾辞','固有名詞','代名詞',
    '発音','語源','由来','翻訳','類義語','対義語','関連語','参考','脚注','外部リンク','注釈','活用','熟語','成句','異表記'
  ];

  function isJapanese(str){
    return /[\u3040-\u30ff\u3400-\u9fff\uff66-\uff9f]/.test(str);
  }

  function setLoading(on){
    btn.disabled = on;
    btn.classList.toggle('loading', on);
  }

  function showResult(html){
    result.innerHTML = html;
    result.hidden = false;
    result.classList.remove('show');
    // restart animation
    void result.offsetWidth;
    result.classList.add('show');
  }

  function escapeHtml(str){
    return str.replace(/[&<>"']/g, s => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[s]));
  }

  // ---------- Japanese Wiktionary ----------
  async function fetchJaWiktionary(term){
    const url = `https://ja.wiktionary.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=extracts&explaintext=1&titles=${encodeURIComponent(term)}`;
    const res = await fetch(url);
    if(!res.ok) return null;
    const data = await res.json();
    const pages = data.query && data.query.pages;
    if(!pages) return null;
    const page = Object.values(pages)[0];
    if(!page || page.missing !== undefined || !page.extract || !page.extract.trim()) return null;
    return {
      term: page.title,
      raw: page.extract,
      sourceLabel: 'Wiktionary（日本語版）',
      sourceUrl: `https://ja.wiktionary.org/wiki/${encodeURIComponent(page.title)}`
    };
  }

  // ---------- English Wiktionary (structured) ----------
  async function fetchEnWiktionary(term){
    const url = `https://en.wiktionary.org/api/rest_v1/page/definition/${encodeURIComponent(term)}`;
    let res;
    try{
      res = await fetch(url);
    }catch(e){ return null; }
    if(!res.ok) return null;
    const data = await res.json();
    const langKey = data.ja ? 'ja' : Object.keys(data)[0];
    if(!langKey) return null;
    return {
      term,
      structured: data[langKey],
      sourceLabel: 'Wiktionary（英語版）',
      sourceUrl: `https://en.wiktionary.org/wiki/${encodeURIComponent(term)}`
    };
  }

  // ---------- Parse raw ja.wiktionary extract into sections ----------
  function parseExtract(raw){
    const lines = raw.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    const blocks = [];
    let current = null;

    for(const line of lines){
      const short = line.length <= 14;
      const isHeading = short && HEADING_WORDS.some(w => line.includes(w)) && !/[。、]/.test(line);
      if(isHeading){
        current = { heading: line, lines: [] };
        blocks.push(current);
      } else {
        if(!current){
          current = { heading: null, lines: [] };
          blocks.push(current);
        }
        current.lines.push(line);
      }
    }
    return blocks;
  }

  function renderExtractBlocks(blocks){
    let html = '';
    for(const b of blocks){
      if(b.lines.length === 0) continue;
      html += '<div class="def-block">';
      if(b.heading) html += `<h3>${escapeHtml(b.heading)}</h3>`;
      for(const line of b.lines){
        html += `<p>${escapeHtml(line)}</p>`;
      }
      html += '</div>';
    }
    return html;
  }

  function renderJaResult(entry){
    const blocks = parseExtract(entry.raw);
    const bodyHtml = renderExtractBlocks(blocks);

    const html = `
      <div class="entry-head">
        <span class="entry-word">${escapeHtml(entry.term)}</span>
      </div>
      <hr class="entry-rule" />
      <div class="extract-box" id="extractBox">
        ${bodyHtml}
      </div>
      <button class="expand-btn" id="expandBtn">全文を表示する</button>
      <div class="source-line">
        <span>情報源</span>
        <a href="${entry.sourceUrl}" target="_blank" rel="noopener">${entry.sourceLabel}で原文を見る</a>
      </div>
    `;
    showResult(html);

    const box = document.getElementById('extractBox');
    const expandBtn = document.getElementById('expandBtn');
    if(box.scrollHeight <= 360){
      expandBtn.style.display = 'none';
      box.style.maxHeight = 'none';
    } else {
      expandBtn.addEventListener('click', () => {
        const expanded = box.classList.toggle('expanded');
        expandBtn.textContent = expanded ? '折りたたむ' : '全文を表示する';
      });
    }
  }

  function renderEnResult(entry){
    const block = entry.structured || [];
    let body = '';
    for(const group of block){
      body += `<div class="def-block">`;
      if(group.partOfSpeech){
        body += `<h3>${escapeHtml(group.partOfSpeech)}</h3>`;
      }
      body += '<ol>';
      for(const d of (group.definitions || [])){
        const text = (d.definition || '').replace(/<[^>]+>/g, '');
        body += `<li>${escapeHtml(text)}</li>`;
      }
      body += '</ol></div>';
    }

    const html = `
      <div class="entry-head">
        <span class="entry-word">${escapeHtml(entry.term)}</span>
      </div>
      <hr class="entry-rule" />
      ${body}
      <div class="source-line">
        <span>情報源（英語）</span>
        <a href="${entry.sourceUrl}" target="_blank" rel="noopener">${entry.sourceLabel}で原文を見る</a>
      </div>
    `;
    showResult(html);
  }

  function renderNotFound(term){
    const q = encodeURIComponent(term);
    const html = `
      <div class="state-msg">
        「${escapeHtml(term)}」は見つかりませんでした
        <small>綴りや表記を変えて試すか、下のリンクから別の辞書を確認してください</small>
      </div>
      <div class="alt-links">
        <a href="https://www.weblio.jp/content/${q}" target="_blank" rel="noopener">Weblioで調べる</a>
        <a href="https://dictionary.goo.ne.jp/srch/all/${q}/m0u/" target="_blank" rel="noopener">goo辞書で調べる</a>
        <a href="https://kotobank.jp/word/${q}" target="_blank" rel="noopener">コトバンクで調べる</a>
      </div>
    `;
    showResult(html);
  }

  function renderError(){
    const html = `
      <div class="state-msg">
        通信中にエラーが発生しました
        <small>時間をおいてもう一度お試しください</small>
      </div>
    `;
    showResult(html);
  }

  async function lookup(term){
    setLoading(true);
    try{
      let entry = null;

      if(isJapanese(term)){
        entry = await fetchJaWiktionary(term);
        if(entry){
          renderJaResult(entry);
        } else {
          entry = await fetchEnWiktionary(term);
          if(entry) renderEnResult(entry);
          else renderNotFound(term);
        }
      } else {
        entry = await fetchEnWiktionary(term);
        if(entry){
          renderEnResult(entry);
        } else {
          entry = await fetchJaWiktionary(term);
          if(entry) renderJaResult(entry);
          else renderNotFound(term);
        }
      }
    } catch(e){
      renderError();
    } finally {
      setLoading(false);
    }
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    const term = input.value.trim();
    if(!term) return;
    lookup(term);
  });
})();
</script>

</body>
</html>
